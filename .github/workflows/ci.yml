name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: SwiftPM
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Lint formatting
        run: swift format lint --recursive --strict Sources Tests Package.swift

      - name: Build and test
        run: swift test
